repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^project/
      - id: ruff-format
        exclude: ^project/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^conda-recipe/meta\.yaml$
      - id: check-toml
      - id: check-case-conflict
      - id: check-ast
      - id: end-of-file-fixer
        exclude: ^project/
      - id: trailing-whitespace
        exclude: ^project/

  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.3.0
    hooks:
      - id: rstcheck
        name: rstcheck (docstrings only)
        files: \.py$
        args: ["--report-level", "warning"]

  - repo: local
    hooks:
      - id: biosim-schema-generate-derived
        name: Generate biosim-schema derived artefacts
        entry: biosim-schema-generate derived
        language: system
        pass_filenames: false
        always_run: true

      - id: biosim-schema-verify-generated
        name: Verify biosim-schema generated artefacts
        entry: biosim-schema-generate verify
        language: system
        pass_filenames: false
        always_run: true

      - id: sphinx-docs
        name: sphinx-build (pre-push, warnings as errors)
        entry: bash -lc 'biosim-schema-generate docs && make -C docs clean && make -C docs html SPHINXOPTS="-W --keep-going"'
        language: system
        pass_filenames: false
        stages: [pre-push]
