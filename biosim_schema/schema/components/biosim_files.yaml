id: https://CCPBioSim.ac.uk/biosim-schema/files
name: biosim-files

prefixes:
  biosim_schema: https://CCPBioSim.ac.uk/biosim-schema/

classes:
  FileMetadata:
    description: Metadata about uploaded or referenced files.
    slots:
      - file_name
      - file_size
      - file_hash
      - file_hash_algorithm
      - file_role

slots:

  file_name:
    description: Name of the file.
    range: string
    required: true
    annotations:
      example:
        - value: topology.prmtop

  file_size:
    description: Size of the file.
    range: ByteQuantity
    minimum_value: 0
    annotations:
      example:
        - value: 2
          value_unit: GB

  file_hash:
    description: Cryptographic hash of the file contents.
    range: string
    annotations:
      example:
        - value: 9b2c...

  file_hash_algorithm:
    description: Algorithm used to calculate the file hash.
    range: FileHashAlgorithm
    annotations:
      example:
        - value: sha256

  file_role:
    description: Role of the file in the simulation submission.
    range: FileRole
    annotations:
      example:
        - value: topology

enums:
  FileHashAlgorithm:
    permissible_values:
      sha256:
        description:
          SHA-256 is a secure cryptographic hash function that turns any input data into a fixed 64-character (256-bit) hexadecimal code. It is a one-way process, meaning you cannot reverse the output to find the original input.
      md5:
        description:
          MD5 (Message-Digest Algorithm 5) is a function that turns any text or file into a unique 32-character code. It acts as a digital fingerprint to check if data is correct.
      xxh3_64:
        description:
          xxh3_64 is the 64-bit variant of XXH3, an extremely fast, non-cryptographic hash algorithm from the xxHash family. It operates near RAM speed limits and outperforms older legacy variants like XXH64 and XXH32 across all input sizes, particularly on small data.

  FileRole:
    permissible_values:
      topology:
        description:
          Defines how atoms connect to form molecules and assigns physical properties like atomic masses, partial charges, and force field parameters for bonds, angles, and dihedrals.
      trajectory:
        description:
          Stores the sequential physical positions, velocities, forces, energies and other time-varying properties of atoms or molecules over the duration of a simulation.
      metadata:
        description:
          Structured data file that describes the parameters, system composition, software versions, and provenance of a simulation experiment.
      log:
        description:
          A text-based output file generated by simulation software that records a step-by-step text history, performance metrics, and thermodynamic property updates during a computational run.
      parameter:
        description:
          Defines the numerical values, physical constraints, and algorithmic settings—such as time steps, temperature, pressure control, and run length—required to execute a computer simulation of atomic movements.
      other:
        description:
          Any other file content that isn't decribed by this list.
