syntax = "proto3";
package biosim_schema;
// metamodel_version: 1.12.0
// version: 1.1.0
// Analysis stage of simulation workflow.
message Analysis {
  // Name of the tool used to analyse simulation.
  repeated AnalysisTool analysis_tool = 1;
  // Name of software used to analyse simulation.
  repeated AnalysisSoftware analysis_software = 2;
  // Name of the method used to analyse simulation.
  repeated AnalysisMethod analysis_method = 3;
}
// A quantity representing angles.
message AngleQuantity {
  float value = 1;
  AngleUnit value_unit = 2;
}
// Settings used for the simulation barostat.
message Barostat {
  // List of barostat algorithms used in the simulation.
  BarostatAlgorithm barostat_algorithm = 1;
  // Compressibility of the simulated system, given as a float.
  CompressibilityQuantity compressibility = 2;
  // Compressibility of the simulated system, given as a float.
  MatrixCompressibilityQuantity compressibility_vector = 3;
  // Target/reference pressure set to reach in the simulation, given as a float.
  PressureQuantity target_pressure = 4;
  // Target/reference pressure set to reach in the simulation, given as a 3x3 array.
  MatrixPressureQuantity target_pressure_vector = 5;
  // Time constant/step (relaxation time of pressure) used for coupling the system pressure, given as a float.
  TimeQuantity pressure_time_constant = 6;
  // Step frequency to apply the barostat.
  FrequencyQuantity pressure_coupling_frequency = 7;
  // List of coupling types for adjusting box vectors.
  PressureCouplingType pressure_coupling_type = 8;
}
// A quantity representing bytes.
message ByteQuantity {
  float value = 1;
  ByteUnit value_unit = 2;
}
// Potential used for carbohydrate molecules.
message CarbohydratePotential {
  // Force field used to describe carbohydrate.
  CarbohydratePotentialName carbohydrate_potential_name = 1;
  // Has the initial model been modified from the original?
  bool modified = 2;
}
// A quantity representing charge.
message ChargeQuantity {
  float value = 1;
  ChargeUnit value_unit = 2;
}
// A quantity representing compressibility.
message CompressibilityQuantity {
  float value = 1;
  CompressibilityUnit value_unit = 2;
}
// Computational environment used to perform simulation.
message ComputationalEnvironment {
  // Computer hardware used to perform simulation.
  Hardware hardware = 1;
  // Computer software used to perform simulation.
  Software software = 2;
  // Compute performance during simulation.
  Performance performance = 3;
}
// A quantity representing concentration.
message ConcentrationQuantity {
  float value = 1;
  ConcentrationUnit value_unit = 2;
}
// Connectivity information included in the topology.
message Connectivity {
  // Are bond parameters present in the topology?
  bool bonds = 1;
  // Are dihedral parameters present in the topology?
  bool dihedrals = 2;
}
// A quantity representing energy.
message EnergyQuantity {
  float value = 1;
  EnergyUnit value_unit = 2;
}
// Simulation ensemble/thermodynamic properties.
message Ensemble {
  // List of ensemble types used in the simulation.
  EnsembleType ensemble_type = 1;
  // Random number used to set (a) distribution of velocities across particles at the start of a simulation and (b) pseudo-random values for dynamics/couplings, given as an integer.
  int32 random_seed = 2;
}
// Equilibration stage of simulation workflow.
message Equilibration {
  // Tool used to perform simulation.
  repeated SimulationTool simulation_tool = 1;
  // Name of software used to perform simulation step.
  repeated SimulationSoftware simulation_software = 2;
}
// Metadata about uploaded or referenced files.
message FileMetadata {
  // Name of the file.
  string file_name = 1;
  // Size of the file.
  ByteQuantity file_size = 2;
  // Cryptographic hash of the file contents.
  string file_hash = 3;
  // Algorithm used to calculate the file hash.
  FileHashAlgorithm file_hash_algorithm = 4;
  // Role of the file in the simulation submission.
  FileRole file_role = 5;
}
// A quantity representing force.
message ForceQuantity {
  float value = 1;
  ForceUnit value_unit = 2;
}
// A quantity representing frequency.
message FrequencyQuantity {
  float value = 1;
  FrequencyUnit value_unit = 2;
}
// A quantity representing friction coefficients.
message FrictionCoefficientQuantity {
  float value = 1;
  FrictionCoefficientUnit value_unit = 2;
}
// Potential used for molecules.
message GeneralPotential {
  // Force field used to describe molecules.
  GeneralPotentialName general_potential_name = 1;
  // Has the initial model been modified from the original?
  bool modified = 2;
}
// Computer hardware used to perform simulation.
message Hardware {
  // Broad type of system used to run the simulation workload.
  ExecutionPlatform execution_platform = 1;
  // Compute node profile used for the simulation run.
  NodeType node_type = 2;
  // Number of compute nodes used for the run.
  int32 node_count = 3;
  // CPU vendor used in the compute nodes.
  CpuVendor CPU_vendor = 4;
  // CPU instruction-set architecture of the compute nodes.
  CpuArchitecture CPU_architecture = 5;
  // Number of physical CPU sockets in each compute node.
  int32 sockets_per_node = 6;
  // Number of physical CPU cores in each socket.
  int32 cores_per_socket = 7;
  // Number of hardware threads per physical core.
  int32 threads_per_core = 8;
  // GPU vendor used by the compute nodes, if applicable.
  GpuVendor GPU_vendor = 9;
  // Number of GPUs present in each compute node.
  int32 GPUs_per_node = 10;
  // Amount of memory installed per compute node.
  ByteQuantity memory_per_node = 11;
}
// Settings used for the simulation integrator.
message Integrator {
  // List of integrator algorithms used to integrate the simulation.
  IntegratorAlgorithm integrator_algorithm = 1;
  // Time between saved snapshots/frames in a simulation, given as a float.
  TimeQuantity frame_step = 2;
  // Time between integration steps in a simulation, given as a float.
  TimeQuantity time_step = 3;
  // Number of integration steps performed in the simulation, given as an integer.
  int32 number_of_steps = 4;
  // Total time molecular dynamics have been sampled in a simulation trajectory, often given by the number of integration steps multiplied by the simulation time step used by the integrator, given as a float.
  TimeQuantity simulation_time = 5;
}
// Settings used to define particle interactions.
message Interactions {
  // Are any positional restraints applied to molecule dynamics? (Restraints usually use harmonic potentials to keep a value near a target).
  bool restraints = 1;
  // Distance in Angstrom at which a electrostatic interaction is turned off and a long-range non-bonded method is turned on, given as a float.
  LengthQuantity electrostatic_cutoff_distance = 2;
  // Distance in Angstrom at which a Van der Waals interaction is turned off and a long-range non-bonded method is turned on.
  LengthQuantity vdw_cutoff_distance = 3;
  // Constraints applied to bonds between two particles in the simulated system.
  BondLengthConstraintsAlgorithm bond_length_constraints_algorithm = 4;
  // Method used to describe long-range interactions between particles.
  LongRangeInteractionMethod long_range_interaction_method = 5;
}
// A quantity representing length.
message LengthQuantity {
  float value = 1;
  LengthUnit value_unit = 2;
}
// Potential used for lipid molecules.
message LipidPotential {
  // Force field used to describe lipids.
  LipidPotentialName lipid_potential_name = 1;
  // Has the initial model been modified from the original?
  bool modified = 2;
}
// Machine learned potential used for molecules.
message MachineLearnedPotential {
  // ML force field used to describe molecules.
  MachineLearnedPotentialName machine_learned_potential_name = 1;
  // Has the initial model been modified from the original?
  bool modified = 2;
}
// A quantity representing mass.
message MassQuantity {
  float value = 1;
  MassUnit value_unit = 2;
}
// A quantity representing compressibility vectors in 3D.
message MatrixCompressibilityQuantity {
  float vector_value = 1;
  CompressibilityUnit value_unit = 2;
}
// A quantity representing pressure vectors in 3D.
message MatrixPressureQuantity {
  float vector_value = 1;
  PressureUnit value_unit = 2;
}
// A quantity representing general vectors in 3D.
message MatrixQuantity {
  float vector_value = 1;
  string value_unit = 2;
}
// Minimisation stage of simulation workflow.
message Minimisation {
  // Tolerance energy for when minimization stops, this is when the maximum force on any atom is less than this value (default is often 1000 kJ/mol/nm or 10−4kcal), given as a float.
  ForceQuantity energy_tolerance = 1;
  // Number of integration steps performed during minimisation of the system, given as an integer.
  int32 number_of_minimisation_steps = 2;
  // The distance the algorithm moves in a single step, controls how large a step the optimizer takes during the initial phase of minimizing the potential energy of a structure, given as a float.
  LengthQuantity minimisation_distance_step_size = 3;
  // Name of the method used to minimise the molecular system.
  repeated MinimisationAlgorithm minimisation_algorithm = 4;
  // Tool used to perform simulation.
  repeated SimulationTool simulation_tool = 5;
  // Name of software used to perform simulation step.
  repeated SimulationSoftware simulation_software = 6;
}
// A quantity representing molar energy.
message MolarEnergyQuantity {
  float value = 1;
  MolarEnergyUnit value_unit = 2;
}
// Identifiers of a molecule type in the simulated system.
message MoleculeID {
  // Protein Data Bank identifier
  string PDB_ID = 1;
  // UniProt accession ID
  string UNIPROT_ID = 2;
  // Simplified Molecular Input Line Entry System (SMILES) ASCII-based line notation used to describe chemical structures. It represents molecular graphs with atoms and bonds, allowing software to convert these short strings into 2D or 3D models.
  string SMILES = 3;
  // The International Chemical Identifier (InChi) is a textual identifier for chemical substances, designed to provide a standard way to encode molecular information
  string InChI = 4;
  // The condensed, 27 character InChIKey, which is a hashed version of the full InChI (using the SHA-256 algorithm), designed to allow for easy web searches of chemical compounds.
  string InChIKey = 5;
  // AlphaFold predicted protein structure identifier (AlphaFold DB, EMBL-EBI)
  string alphafold_ID = 6;
  // PubChem CID of chemical molecules and their activities against biological assays.
  string PubChem_CID = 7;
  // One letter sequence for protein amino acids.
  string protein_sequence = 8;
  // One letter sequence for nucleic acid nucleotides.
  string nucleic_sequence = 9;
  // Are the molecule positions derived from a prediction?
  bool predicted_structure = 10;
  // Has the initial model been modified from the original?
  bool modified = 11;
  // The molecular formula of a molecule\
  string molecular_formula = 12;
  // The molecular weight of a molecule.
  MassQuantity molecular_weight = 13;
  // Electrostatic charge of a molecule.
  ChargeQuantity molecule_charge = 14;
  // Number of instances of a given molecule, defined as bonded atoms or beads.
  int32 molecule_count = 15;
  // Number of atoms in a molecule.
  int32 atom_count = 16;
  // Number of monomeric units in a polymer(e.g. protein or nucleic acid).
  int32 monomer_count = 17;
  // List of particle names (e.g. atoms or beads) that describe a simulated molecule
  string simulated_particle_names = 18;
  // Molecule name used in the simulation.
  string simulated_molecule_name = 19;
}
// Potential used for nucleic acid molecules.
message NucleicPotential {
  // Force field used to describe nucleic acids.
  NucleicPotentialName nucleic_potential_name = 1;
  // Has the initial model been modified from the original?
  bool modified = 2;
}
// Particle information included in the topology.
message Particles {
  // Are masses present in the topology?
  bool masses = 1;
  // Are fixed charges on atoms included in the topology?
  bool fixed_charges = 2;
  // Total electrostatic charge of the system given by the elementary charge (e).
  ChargeQuantity system_charge = 3;
  // Are atoms coarse-grained?
  bool coarse_grained = 4;
  // Resolution of simulated system.
  ModelResolution resolution = 5;
}
// Compute performance during simulation.
message Performance {
  // Total elapsed runtime of the simulation.
  TimeQuantity wall_time = 1;
  // Total energy consumed by the simulation run.
  EnergyQuantity energy_consumption = 2;
}
// Potential used for polymers molecules.
message PolymerPotential {
  // Force field used to describe polymers (excluding proteins and nucleic acids).
  PolymerPotentialName polymer_potential_name = 1;
  // Has the initial model been modified from the original?
  bool modified = 2;
}
// Potentials used for various modelled molecules.
message PotentialMetadata {
  // Force field for water molecules.
  WaterPotential water_potential = 1;
  // Force field for proteins.
  ProteinPotential protein_potential = 2;
  // Force field for lipids.
  LipidPotential lipid_potential = 3;
  // Force field for nucleic acids.
  NucleicPotential nucleic_potential = 4;
  // Force field for carbohydrates.
  CarbohydratePotential carbohydrate_potential = 5;
  // Force field for polymers (excluding proteins and nucleic acids).
  PolymerPotential polymer_potential = 6;
  // Force field for molecules (in general).
  GeneralPotential general_potential = 7;
  // ML force field for molecules (in general).
  MachineLearnedPotential machine_learned_potential = 8;
}
// A quantity representing pressure.
message PressureQuantity {
  float value = 1;
  PressureUnit value_unit = 2;
}
// Production stage of simulation workflow.
message Production {
  // Tool used to perform simulation.
  repeated SimulationTool simulation_tool = 1;
  // Name of software used to perform simulation step.
  repeated SimulationSoftware simulation_software = 2;
  // Version of software used to perform simulation step.
  string simulation_software_version = 3;
  // Method used to perform simulation.
  repeated SimulationMethod simulation_method = 4;
}
// Potential used for protein molecules.
message ProteinPotential {
  // Force field used to describe proteins.
  ProteinPotentialName protein_potential_name = 1;
  // Has the initial model been modified from the original?
  bool modified = 2;
}
// Setup stage of simulation workflow.
message Setup {
  // Name of the tool used to setup simulation.
  SetupTool setup_tool = 1;
}
// Average values of observables outputted from the simulation.
message SimulationAverages {
  // Average kinetic energy sampled from the simulation, given as a float.
  MolarEnergyQuantity average_kinetic_energy = 1;
  // Average potential energy sampled from the simulation, given as a float.
  MolarEnergyQuantity average_potential_energy = 2;
  // Average enthalpy sampled from the simulation, given as a float.
  MolarEnergyQuantity average_enthalpy = 3;
  // Average pressure sampled from the simulation, given as a float.
  PressureQuantity average_pressure = 4;
  // Average temperature sampled from the simulation, given as a float.
  TemperatureQuantity average_temperature = 5;
  // Average volume sampled from the simulation, given as a float.
  VolumeQuantity average_volume = 6;
  // Average volume sampled from the simulation, given as a list, (e.g. 10, 10, 10).
  VectorVolumeQuantity average_volume_vector = 7;
}
// Simulation box information
message SimulationBox {
  // The lengths/dimensions of the box used to simulate the system.
  VectorLengthQuantity box_dimensions = 1;
  // The angles of the box used to simulate the system.
  VectorAngleQuantity box_angles = 2;
  // The type of box used to simuluate the system.
  BoxType box_type = 3;
  // What directions in a simulation cell periodic boundaries are set if they are turned on.
  PeriodicBoundaryConditions periodic_boundary_conditions = 4;
}
// root class for biosim-schema
message SimulationMetadata {
  // Simulation stages
  SimulationStages stages = 1;
  // Simulation settings
  SimulationSettings settings = 2;
  // Simulation observables.
  SimulationObservables observables = 3;
  // Topology information.
  TopologyMetadata topology = 4;
  // Trajectory information.
  TrajectoryMetadata trajectory = 5;
  // Composition of simulated system.
  SystemComposition composition = 6;
  // Force field potentials used to describe simulated particles.
  PotentialMetadata potentials = 7;
  // Computational environment information.
  ComputationalEnvironment compute = 8;
  // Files associated with this simulation metadata record.
  repeated FileMetadata files = 9;
  // Version of biosim-schema used to populate metadata.
  string biosim_schema_version = 10;
}
// Simulation observables outputted from simulation.
message SimulationObservables {
  // Average values of observables outputted from the simulation.
  SimulationAverages simulation_averages = 1;
}
// Settings in simulation.
message SimulationSettings {
  // Ensemble information.
  Ensemble ensemble = 1;
  // Integrator information.
  Integrator integrator = 2;
  // Barostat information.
  Barostat barostat = 3;
  // thermostat information.
  Thermostat thermostat = 4;
  // Interaction information.
  Interactions interactions = 5;
}
// Stages of simulation workflow.
message SimulationStages {
  // Setup stage of a simulation.
  Setup setup = 1;
  // Minimisation stage of a simulation.
  Minimisation minimisation = 2;
  // Equilibration stage of a simulation.
  Equilibration equilibration = 3;
  // Production stage of a simulation.
  Production production = 4;
  // Analysis stage of a simulation.
  Analysis analysis = 5;
}
// Computer software used to perform simulation.
message Software {
  // Operating system installed on the hardware used to perform the simulation.
  OperatingSystem operating_system = 1;
  // Workload manager or job scheduler used to launch the simulation.
  Scheduler scheduler = 2;
  // MPI implementation used for distributed parallel execution.
  MPILibrary MPI_library = 3;
  // Container runtime used to execute the simulation environment, if any.
  ContainerRuntime container_runtime = 4;
}
// Molecular composition of simulated system.
message SystemComposition {
  // Entity counts across the simulated system.
  SystemCounts system_counts = 1;
  // Persistent identifier of a molecule being simulated.
  repeated MoleculeID molecule_ID = 2;
}
// Entity counts across the simulated system.
message SystemCounts {
  // Total number of simulated molecules, defined as bonded atoms or beads.
  int32 total_molecule_count = 1;
  // Total number of atoms in the simulation.
  int32 total_atom_count = 2;
  // Number of unique simulated molecules, defined as bonded atoms or beads.
  int32 unique_molecule_count = 3;
  // Concentration of salt in the solution.
  ConcentrationQuantity salt_concentration = 4;
}
// A quantity representing temperature.
message TemperatureQuantity {
  float value = 1;
  TemperatureUnit value_unit = 2;
}
// Settings used for the simulation thermostat.
message Thermostat {
  // List of thermostat algorithms used in the simulation.
  ThermostatAlgorithm thermostat_algorithm = 1;
  // Target/reference temperature set to reach in the simulation, given as a float.
  TemperatureQuantity target_temperature = 2;
  // Target/reference temperature set to reach in the simulation, given as a list (e.g. 300, 300).
  VectorTemperatureQuantity target_temperature_vector = 3;
  // Collision frequency for the integrator, given as a float.
  FrequencyQuantity collision_frequency = 4;
  // Time constant for coupling the system temperature in seconds units, given as a list (e.g. 0.1, 0.1).
  VectorTimeQuantity temperature_time_constant = 5;
  // A subset of atoms for which temperature is controlled, often needed for simulating complex systems (e.g., protein in water), used in gromacs, given as a string
  string coupling_group = 6;
  // Usually required in the Nosé-Hoover thermostat, the chain length (e.g., nh-chain-length in GROMACS) is used to maintain canonical distribution, given as an integer.
  int32 chain_length = 7;
  // Usually used in the Langevin thermostat, the friction coefficient determines the strength of coupling between a system and a heat bath, given as a float.
  FrictionCoefficientQuantity friction_coefficient = 8;
}
// A quantity representing time.
message TimeQuantity {
  float value = 1;
  TimeUnit value_unit = 2;
}
// Topology information.
message TopologyMetadata {
  // Particle connectivity information
  Connectivity connectivity = 1;
  // Particles information
  Particles particles = 2;
}
// Information in trajectory files.
message Trajectories {
  // Are per-frame positions included in the trajectory?
  bool positions = 1;
  // Are per-frame forces included in the trajectory?
  bool forces = 2;
  // Are per-frame velocities included in the trajectory?
  bool velocities = 3;
  // Are per-frame polarizable charges included in the trajectory?
  bool polarizable_charges = 4;
  // Are per-frame energies included in the trajectory?
  bool energies = 5;
  // Are water molecules included in the trajectory?
  bool water = 6;
  // Is this trajectory a replica of another provided trajectory?
  bool replica = 7;
  // Total number of snapshots that make up a trajectory.
  int32 frame_count = 8;
}
// Trajectory information.
message TrajectoryMetadata {
  // Information about the simulation box.
  SimulationBox simulation_box = 1;
  // Information included in trajectory files.
  Trajectories trajectory_output = 2;
}
// A quantity representing 3D angles.
message VectorAngleQuantity {
  repeated float vector_value = 1;
  AngleUnit value_unit = 2;
}
// A quantity representing compressibility in 3D.
message VectorCompressibilityQuantity {
  float vector_value = 1;
  CompressibilityUnit value_unit = 2;
}
// A quantity representing 3D lengths/dimensions.
message VectorLengthQuantity {
  repeated float vector_value = 1;
  LengthUnit value_unit = 2;
}
// A quantity representing pressure in 3D.
message VectorPressureQuantity {
  repeated float vector_value = 1;
  PressureUnit value_unit = 2;
}
// Temperature values for multiple coupling groups.
message VectorTemperatureQuantity {
  repeated float vector_value = 1;
  TemperatureUnit value_unit = 2;
}
// Time values for multiple coupling groups.
message VectorTimeQuantity {
  repeated float vector_value = 1;
  TimeUnit value_unit = 2;
}
// A quantity representing volume as via 3 length dimensions.
message VectorVolumeQuantity {
  repeated float vector_value = 1;
  LengthUnit value_unit = 2;
}
// A quantity representing volume.
message VolumeQuantity {
  float value = 1;
  VolumeUnit value_unit = 2;
}
// Potential used for water molecules.
message WaterPotential {
  // Force field used to describe water molecules.
  WaterPotentialName water_potential_name = 1;
  // Has the initial model been modified from the original?
  bool modified = 2;
}

// Methods used to analyse simulation outputs.
enum AnalysisMethod {
  ANALYSIS_METHOD_UNSPECIFIED = 0;
  ANALYSIS_METHOD_RMSD = 1;
  ANALYSIS_METHOD_DSSP = 2;
  ANALYSIS_METHOD_GIST = 3;
  ANALYSIS_METHOD_HYDROGEN_BONDS = 4;
  ANALYSIS_METHOD_CONNOLLY_SURFACE = 5;
  ANALYSIS_METHOD_RADIUS_OF_GYRATION = 6;
  ANALYSIS_METHOD_BAR_PBSA = 7;
}
// Software used to analyse simulation outputs.
enum AnalysisSoftware {
  ANALYSIS_SOFTWARE_UNSPECIFIED = 0;
  ANALYSIS_SOFTWARE_VISUAL_MOLECULAR_DYNAMICS_VMD = 1;
  ANALYSIS_SOFTWARE_SCHR_DINGER_MAESTRO = 2;
  ANALYSIS_SOFTWARE_PY_MOL = 3;
  ANALYSIS_SOFTWARE_AVOGADRO = 4;
}
// Tools used to analyse simulation outputs.
enum AnalysisTool {
  ANALYSIS_TOOL_UNSPECIFIED = 0;
  ANALYSIS_TOOL_MDOUT_ANALYZER_PY = 1;
  ANALYSIS_TOOL_AMBPDB = 2;
  ANALYSIS_TOOL_CPPTRAJ = 3;
  ANALYSIS_TOOL_PYTRAJ = 4;
  ANALYSIS_TOOL_MMPBSA_PY = 5;
  ANALYSIS_TOOL_FREE_ENERGY_WORKFLOW_FEW = 6;
  ANALYSIS_TOOL_EDGEMBER = 7;
  ANALYSIS_TOOL_SAX_RISM = 8;
  ANALYSIS_TOOL_SAX_MD = 9;
  ANALYSIS_TOOL_MO_FT = 10;
  ANALYSIS_TOOL_NDFES = 11;
  ANALYSIS_TOOL_PLUMED = 12;
  ANALYSIS_TOOL_MDANALYSIS = 13;
}
// Units for angles.
enum AngleUnit {
  ANGLE_UNIT_UNSPECIFIED = 0;
  ANGLE_UNIT_DEGREE = 1;
  ANGLE_UNIT_RADIAN = 2;
}
// Barostat algorithm used to set the pressure in a simulation.
enum BarostatAlgorithm {
  BAROSTAT_ALGORITHM_UNSPECIFIED = 0;
  BAROSTAT_ALGORITHM_BERENDSEN = 1;
  BAROSTAT_ALGORITHM_ANDERSEN = 2;
  BAROSTAT_ALGORITHM_PARRINELLO_RAHMAN = 3;
  BAROSTAT_ALGORITHM_NOSE_HOOVER = 4;
  BAROSTAT_ALGORITHM_MONTE_CARLO = 5;
  BAROSTAT_ALGORITHM_MARTYNA_TUCKERMAN_TOBIAS_KLEIN = 6;
}
// Fix specific molecular degrees of freedom—typically fast bond vibrations involving hydrogen atoms. By eliminating these high-frequency motions, constraints allow for larger integration time steps (e.g., 2 fs instead of 0.5 fs), significantly speeding up simulations without disrupting system dynamics.
enum BondLengthConstraintsAlgorithm {
  BOND_LENGTH_CONSTRAINTS_ALGORITHM_UNSPECIFIED = 0;
  BOND_LENGTH_CONSTRAINTS_ALGORITHM_SHAKE = 1;
  BOND_LENGTH_CONSTRAINTS_ALGORITHM_RATTLE = 2;
  BOND_LENGTH_CONSTRAINTS_ALGORITHM_SETTLE = 3;
  BOND_LENGTH_CONSTRAINTS_ALGORITHM_LINCS = 4;
  BOND_LENGTH_CONSTRAINTS_ALGORITHM_CCMA = 5;
}
// Types of box used to simulate the system.
enum BoxType {
  BOX_TYPE_UNSPECIFIED = 0;
  BOX_TYPE_CUBIC = 1;
  BOX_TYPE_TETRAGONAL = 2;
  BOX_TYPE_ORTHORHOMBIC = 3;
  BOX_TYPE_TRUNCATED_OCTAHEDRON = 4;
  BOX_TYPE_TRICLINIC = 5;
}
// Units for Bytes.
enum ByteUnit {
  BYTE_UNIT_UNSPECIFIED = 0;
  BYTE_UNIT_GB = 1;
  BYTE_UNIT_MB = 2;
}
// Force fields used to parametrize carbohydrates in a simulation.
enum CarbohydratePotentialName {
  CARBOHYDRATE_POTENTIAL_NAME_UNSPECIFIED = 0;
  CARBOHYDRATE_POTENTIAL_NAME_GLYCAM06 = 1;
  CARBOHYDRATE_POTENTIAL_NAME_GLYCAM_N06_EP = 2;
  CARBOHYDRATE_POTENTIAL_NAME_GLYCAM_N06J_N1 = 3;
}
// Units for charge quantity.
enum ChargeUnit {
  CHARGE_UNIT_UNSPECIFIED = 0;
  CHARGE_UNIT_E = 1;
  CHARGE_UNIT_C = 2;
}
// measures how the system volume responds to pressure changes.
enum CompressibilityUnit {
  COMPRESSIBILITY_UNIT_UNSPECIFIED = 0;
  COMPRESSIBILITY_UNIT_N1_BAR = 1;
  COMPRESSIBILITY_UNIT_N1_PA = 2;
}
// Units for concentration quantity.
enum ConcentrationUnit {
  CONCENTRATION_UNIT_UNSPECIFIED = 0;
  CONCENTRATION_UNIT_M = 1;
}
// Container runtime used to package and run software.
enum ContainerRuntime {
  CONTAINER_RUNTIME_UNSPECIFIED = 0;
  CONTAINER_RUNTIME_APPTAINER = 1;
  CONTAINER_RUNTIME_DOCKER = 2;
  CONTAINER_RUNTIME_PODMAN = 3;
  CONTAINER_RUNTIME_NONE = 4;
}
// CPU architecture used by the compute nodes.
enum CpuArchitecture {
  CPU_ARCHITECTURE_UNSPECIFIED = 0;
  CPU_ARCHITECTURE_X86 = 1;
  CPU_ARCHITECTURE_ARM = 2;
}
// Vendor of the CPU used in the compute nodes.
enum CpuVendor {
  CPU_VENDOR_UNSPECIFIED = 0;
