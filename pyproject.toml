[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "biosim_schema"
dynamic = ["version"]

description = "Schema for biomolecular simulation metadata created with LinkML"
authors = [
    { name = "Jas Kalayan", email = "jas.kalayan@stfc.ac.uk" },
]
maintainers = [
    { name = "Jas Kalayan", email = "jas.kalayan@stfc.ac.uk" },
]

readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

keywords = ["biosim", "schema", "molecular dynamics", "linkml"]

dependencies = [
    "linkml==1.12.1",
    "linkml-runtime>=1.12.0,<2.0",
    "check-jsonschema>=0.38.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/CCPBioSim/biosim-schema/"
Repository = "https://github.com/CCPBioSim/biosim-schema.git"
Documentation = "https://biosim-schema.github.io/"
Source = "https://github.com/jkalayan/biosim-schema"

#
# Optional dependency groups
#

[project.optional-dependencies]
invenio = [
    "marshmallow>=4.3,<5",
    "marshmallow-utils>=0.9,<1",
]

testing = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "pytest-sugar>=1.1,<2.0"
]

pre-commit = [
    "pre-commit>=4.5,<5.0",
    "ruff>=0.15.2,<1.0",
    "pylint>=4.0,<5.0",
    "rstcheck>=6.2,<7.0"
]

docs = [
    "sphinx>=9,<10",
    "nbsphinx>=0.9,<1.0",
    "sphinx_copybutton>=0.5,<1.0",
    "furo>=2025.12.19,<2026.0",
    "markupsafe>=3.0,<4.0",
    "myst-parser>=5,<6",
    "sphinxcontrib.mermaid",
]

[project.scripts]
biosim-schema-generate = "biosim_schema.utils.generate_artifacts:main"

#
# Ruff configuration inside pyproject (recommended)
#

[tool.ruff]
line-length = 88
target-version = "py312"
# Generated by biosim-schema-generate, so not linted
extend-exclude = ["project"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

#
# Pytest configuration
#

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]

addopts = "-vv -ra"
